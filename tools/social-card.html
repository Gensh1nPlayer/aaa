<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Roshine social preview artwork</title>
<style>
* { box-sizing:border-box; }
html,body { width:1200px; height:630px; margin:0; overflow:hidden; }
body { background:#080813; color:#ede9f8; font-family:Bahnschrift,"Arial Narrow",Arial,sans-serif; }
.art { position:relative; width:1200px; height:630px; overflow:hidden; }
.edge { position:absolute; top:0; left:0; right:0; height:5px; background:#9b79db; }
.header { position:absolute; left:55px; top:41px; display:flex; align-items:center; gap:15px; z-index:4; }
.logo { width:228px; height:auto; object-fit:contain; }
.wordmark { font-size:29px; letter-spacing:1.6px; font-weight:800; }
.header small { border-left:1px solid #9b79db45; padding-left:19px; margin-left:7px; color:#b6a9c8; font-size:12px; line-height:1.55; font-weight:650; letter-spacing:1.8px; }
.copy { position:absolute; top:138px; left:58px; z-index:4; }
.versions { display:flex; align-items:center; gap:9px; margin-bottom:22px; }
.version { padding:7px 12px 5px; border:1px solid #9b79db66; background:#9b79db12; font-size:15px; font-weight:700; letter-spacing:1.5px; }
.versions .note { color:#b6a9c8; font-size:12px; letter-spacing:1.4px; margin-left:10px; }
h1 { margin:0; font-size:82px; font-weight:900; font-stretch:condensed; letter-spacing:-1.8px; line-height:1.03; }
h1 span { display:block; }
h1 .second { font-style:italic; }
.underline { margin-top:24px; width:59px; height:4px; background:#9b79db; }
.lead { margin:26px 0 9px; color:#ddd3ed; font-size:26px; font-weight:650; }
.detail { color:#b2a7c2; font-size:18px; margin:0; letter-spacing:.15px; }
.footer { position:absolute; bottom:46px; left:58px; z-index:4; display:flex; align-items:center; gap:16px; }
.arrow { display:grid; place-items:center; width:38px; height:38px; background:#9b79db; color:#080813; font-size:29px; line-height:1; transform:skewX(-8deg); }
.domain { font-size:25px; letter-spacing:.3px; font-weight:700; }
.stage { position:absolute; top:0; right:0; width:550px; height:630px; clip-path:polygon(18% 0,100% 0,100% 100%,0 100%); background:linear-gradient(160deg,#201633,#151022 62%,#110d1b); }
.stage::before { content:""; position:absolute; inset:0; opacity:.12; background:repeating-linear-gradient(110deg,transparent 0 72px,rgba(155,121,219,.55) 73px 74px,transparent 75px 144px); }
.stage::after { content:""; position:absolute; top:0; bottom:0; left:80px; width:2px; background:#9b79db66; transform:skewX(-10deg); }
.arc { position:absolute; width:458px; height:458px; right:-41px; top:73px; border:1px solid #9b79db33; border-radius:50%; box-shadow:0 0 0 31px #9b79db08,0 0 0 32px #9b79db22; }
.arc::after { content:""; position:absolute; inset:28px; border:13px solid #9b79db14; border-top-color:#9b79db55; border-right-color:transparent; border-radius:50%; transform:rotate(-24deg); }
.stage-label { position:absolute; top:50px; right:49px; color:#b6a9c8; font-size:12px; font-weight:700; letter-spacing:2.7px; }
.roster { position:absolute; width:515px; height:430px; top:137px; right:0; z-index:3; }
.hero { position:absolute; overflow:hidden; transform:skewX(-7deg); border:3px solid rgba(255,255,255,.86); box-shadow:10px 15px 25px rgba(32,56,81,.12); }
.hero img { position:absolute; object-fit:cover; transform:skewX(7deg); }
.hero .name { position:absolute; bottom:0; left:0; width:100%; background:#21182f; color:white; text-align:center; font-size:17px; font-weight:800; letter-spacing:2px; padding:13px 0 11px; }
.genji { left:9px; top:91px; width:174px; height:267px; background:linear-gradient(135deg,#c4d1ba,#899f97); }
.genji img { width:228px; height:228px; left:-34px; top:7px; }
.mercy { right:-9px; top:59px; width:168px; height:287px; background:linear-gradient(135deg,#ecdabc,#b9a684); }
.mercy img { width:248px; height:248px; left:-34px; top:-1px; }
.kiriko { left:165px; top:4px; width:213px; height:367px; background:linear-gradient(155deg,#edf2f6,#b4c4d5); border-color:#eee9f8; box-shadow:0 0 0 4px #9b79db,16px 26px 32px rgba(0,0,0,.19); z-index:4; }
.kiriko img { width:324px; height:324px; left:-49px; top:1px; }
.kiriko .name { background:#9b79db; color:#080813; font-size:22px; letter-spacing:2.8px; padding:15px 0 13px; }
.corner { position:absolute; right:51px; bottom:45px; color:#b6a9c8; text-align:right; font-size:12px; font-weight:650; line-height:1.8; letter-spacing:2px; z-index:4; }
.corner strong { display:block; color:#ddd3ed; font-size:15px; letter-spacing:3px; }
.cross { position:absolute; right:43px; top:110px; color:#fff; font-size:28px; font-weight:300; }
</style>
</head>
<body>
<main class="art">
  <div class="edge"></div>
  <header class="header"><img class="logo" src="../assets/roshine-wordmark.svg" alt="Roshine"><small>ACCOUNT STORE<br>EST. 2021</small></header>
  <div class="copy">
    <div class="versions"><span class="version">OW1</span><span class="version">OW2</span><span class="note">LIVE ACCOUNT STOCK</span></div>
    <h1><span>OVERWATCH</span><span class="second">ACCOUNTS.</span></h1>
    <div class="underline"></div>
    <p class="lead">Rare skins. Ranked ready.</p>
    <p class="detail">Collector stock &amp; direct Discord support.</p>
  </div>
  <div class="stage"><div class="arc"></div><span class="stage-label">CHOOSE YOUR NEXT ACCOUNT</span><span class="cross">+</span></div>
  <div class="roster">
    <div class="hero genji"><img src="../assets/social/genji.png" alt=""><span class="name">GENJI</span></div>
    <div class="hero mercy"><img src="../assets/social/mercy.png" alt=""><span class="name">MERCY</span></div>
    <div class="hero kiriko"><img src="../assets/social/kiriko.png" alt=""><span class="name">KIRIKO</span></div>
  </div>
  <div class="footer"><span class="arrow">↗</span><span class="domain">roshine.love</span></div>
  <div class="corner"><strong>SKINS · RANKS · COLLECTIONS</strong>VIEW STOCK · COMPARE SCREENSHOTS</div>
</main>
</body>
</html>
