ign-items:center;gap:12px;color:#fff;font-size:.82rem;font-weight:900;letter-spacing:.17em;text-decoration:none}.brand img{width:44px;height:44px;padding:6px;border:1px solid rgba(161,118,255,.34);border-radius:13px;background:rgba(130,74,236,.12)}.kicker{position:relative;z-index:1;margin-top:66px;color:#a983f2;font-size:.62rem;font-weight:900;letter-spacing:.18em}.code{position:relative;z-index:1;margin:12px 0 4px;font-size:clamp(5.5rem,20vw,11rem);font-weight:1000;line-height:.8;letter-spacing:-.085em;background:linear-gradient(110deg,#fff 20%,#b990ff 62%,#d44fe9);-webkit-background-clip:text;background-clip:text;color:transparent}.card h1{position:relative;z-index:1;margin:25px 0 12px;font-size:clamp(1.5rem,4vw,2.6rem);letter-spacing:-.04em}.card p{position:relative;z-index:1;max-width:520px;margin:0;color:#9891a5;line-height:1.7}.actions{position:relative;z-index:1;display:flex;flex-wrap:wrap;gap:10px;margin-top:30px}.actions a{min-height:47px;display:inline-flex;align-items:center;justify-content:center;padding:0 20px;border:1px solid rgba(160,116,255,.3);border-radius:13px;color:#e9e4f2;text-decoration:none;font-size:.74rem;font-weight:800;background:rgba(255,255,255,.03);transition:transform .22s ease,border-color .22s ease,box-shadow .22s ease}.actions a:hover{border-color:rgba(172,126,255,.62);transform:translateY(-2px)}.actions a:first-child{border-color:transparent;color:#fff;background:linear-gradient(110deg,#7440df,#b44ee8);box-shadow:0 15px 35px rgba(115,56,220,.25)}@keyframes starDrift{to{background-position:173px 173px,-207px 327px,442px -319px,72px 72px,72px 72px}}@keyframes atmosphere{from{transform:translate3d(-1.5%,0,0) scale(1)}to{transform:translate3d(1.5%,1%,0) scale(1.035)}}@media(max-width:560px){.card{padding:30px 22px;border-radius:22px}.kicker{margin-top:50px}.actions{display:grid}.actions a{width:100%}}@media(prefers-reduced-motion:reduce){body:before,body:after{animation:none}}

<body>
  <main class="card">
    <a class="brand" id="brandLink" href="/"><img src="/assets/logo.png" alt="" />ROSHINE.</a>
    <div class="kicker">LOST IN THE INVENTORY</div>
    <div class="code">404</div>
    <h1>This page is not in stock.</h1>
    <p>The link may be old, incomplete, or already moved. Return to the live inventory, or ask us on Discord if you were looking for a specific account.</p>
    <div class="actions"><a id="homeLink" href="/">Browse live stock</a><a href="https://discord.gg/WYqfYXW29U" target="_blank" rel="noopener">Ask on Discord</a></div>
  </main>
  <script>
  (function () {
    var path = location.pathname || "/";
    var parts = path.split("/").filter(Boolean);
    var last = parts.length ? parts[parts.length - 1] : "";
    var base = path.replace(/\/[^\/]*$/, "/");
    if (!base.endsWith("/")) base += "/";
    if (/^[0-9a-fA-F]+$/.test(last)) {
      location.replace(base + "?key=" + encodeURIComponent(last));
      return;
    }
    document.getElementById("homeLink").href = base;
    document.getElementById("brandLink").href = base;
  })();
  </script>
  <script src="/assets/void-effects.js?v=1" defer></script>
</body>
